name: (Reusable) .NET Service - Security & Compliance

# Bộ security suite đầy đủ, dùng chung cho cả 3 service .NET (attendance/HRCore/payroll)
# thay vì chỉ attendance-service có mà 2 service kia không có như trước.

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_path:
        description: "Thư mục gốc của service (dùng cho dependency-check & TruffleHog)"
        required: true
        type: string
      dockerfile_path:
        required: true
        type: string
      docker_context_path:
        required: true
        type: string
      dotnet_version:
        required: true
        type: string
      project_path:
        required: true
        type: string

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency Check
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ inputs.service_name }}
          path: ${{ inputs.service_path }}
          format: 'SARIF'
          args: >
            --enableExperimental

      - name: Upload dependency check results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: '${{ github.workspace }}/reports/dependency-check-report.sarif'

  container-scan:
    runs-on: ubuntu-latest
    name: Container Image Scan
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: docker build -t ${{ inputs.service_name }}:scan -f ${{ inputs.dockerfile_path }} ${{ inputs.docker_context_path }}

      - name: Scan with Grype
        uses: anchore/scan-action@v6
        id: grype
        with:
          image: ${{ inputs.service_name }}:scan
          fail-build: true
          severity-cutoff: medium

      - name: Upload Grype results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}

  secret-scan:
    runs-on: ubuntu-latest
    name: Secret Scanning
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scanning
        uses: trufflesecurity/trufflehog@v3.90.8
        with:
          path: ${{ inputs.service_path }}
          # Không set base/head: để TruffleHog tự quét toàn bộ lịch sử. Nếu set
          # base/head mà 2 giá trị trùng nhau (hay gặp khi chạy tay qua
          # workflow_dispatch, hoặc branch chỉ có 1 commit), action sẽ lỗi
          # "BASE and HEAD commits are the same" và không quét được gì.
          extra_args: --debug --only-verified

  sast:
    runs-on: ubuntu-latest
    name: Static Application Security Testing
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@v1
        id: msdo
        with:
          categories: 'code,secrets'

      - name: Upload results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: '${{ steps.msdo.outputs.sarifFile }}'

  license-check:
    runs-on: ubuntu-latest
    name: License Compliance Check
    timeout-minutes: 10
    permissions:
      contents: read
    # Cần tài khoản FOSSA + secret FOSSA_API_KEY. Nếu chưa dùng, job tự skip
    # (không xóa job để khi bật FOSSA sau này không phải viết lại workflow).
    if: ${{ vars.FOSSA_ENABLED == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check licenses
        uses: fossas/fossa-action@v1.4.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
