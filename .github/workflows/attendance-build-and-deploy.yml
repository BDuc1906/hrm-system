name: Attendance Service - Build & Deploy Docker Image

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'attendance-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'attendance-service/**'
  workflow_dispatch: {}

jobs:
  ci:
    uses: ./.github/workflows/_reusable-dotnet-build.yml
    with:
      service_name: attendance-service
      project_path: attendance-service/API/API.csproj
      # Repo hiện chưa có project test cho attendance-service.
      # Khi thêm project (vd attendance-service/API.Tests/API.Tests.csproj),
      # điền đường dẫn vào đây để bước test được bật tự động.
      test_project_path: ""
      dockerfile_path: ./attendance-service/API/Dockerfile
      context_path: ./attendance-service
      dotnet_version: '10.0.x'
      image_name: attendance-service
      trivy_scan_ref: attendance-service/API
      enable_sonar: ${{ vars.SONAR_ORGANIZATION != '' }}
      enable_slack_notify: true
      fail_on_critical_vuln: false
    secrets: inherit
