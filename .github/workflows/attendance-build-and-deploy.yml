name: Attendance Service - Build & Deploy Docker Image

# QUAN TRỌNG: file này phải nằm ở "<repo-root>/.github/workflows/", không phải
# "attendance-service/.github/workflows/" — GitHub Actions chỉ đọc workflow ở
# thư mục gốc của repo, workflow trong thư mục con sẽ KHÔNG BAO GIỜ được kích hoạt.

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'attendance-service/**'
  pull_request:
    branches:
      - main
    paths:
      - 'attendance-service/**'
  workflow_dispatch: {} # Cho phép bấm nút "Run workflow" chạy tay để test

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/attendance-service

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore attendance-service/API/API.csproj

      - name: Build
        run: dotnet build attendance-service/API/API.csproj -c Release --no-restore

      # Lưu ý: repo hiện chưa có project test (.Tests.csproj) nào cho attendance-service.
      # Bước "dotnet test" trỏ vào project chính sẽ không tìm thấy test nào để chạy.
      # Khi bạn thêm project test, đổi đường dẫn dưới đây trỏ vào project test đó.
      - name: Run tests
        run: dotnet test attendance-service/API/API.csproj -c Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io bắt buộc tên repository toàn chữ thường; github.repository_owner
      # giữ nguyên hoa/thường của username (vd "BDuc1906"), nên phải tự chuyển về
      # chữ thường trước khi dùng làm tag, nếu không bước build-push sẽ báo lỗi
      # "repository name must be lowercase".
      - name: Chuẩn hóa tên image về chữ thường
        run: echo "IMAGE_NAME_LC=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./attendance-service
          file: ./attendance-service/API/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:buildcache,mode=max

  code-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud cần full history để phân tích chính xác

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore attendance-service/API/API.csproj

      - name: Build
        run: dotnet build attendance-service/API/API.csproj -c Release --no-restore

      # Yêu cầu: đã tạo project SonarCloud và cấu hình secret SONAR_TOKEN.
      # Job này chỉ nên chạy nếu bạn thực sự dùng SonarCloud — nếu không, xóa job này đi.
      - name: Run SonarCloud analysis
        if: ${{ vars.SONAR_ORGANIZATION != '' }}
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'attendance-service/API'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  notify:
    runs-on: ubuntu-latest
    needs: [test, build, code-quality, security]
    if: always()

    steps:
      - name: Send Slack notification
        if: ${{ vars.SLACK_NOTIFICATIONS_ENABLED == 'true' }}
        uses: slackapi/slack-github-action@v2.0.0
        with:
          payload: |
            {
              "text": "Build Result: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Attendance Service Build*\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref }}\nStatus: ${{ job.status }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
