name: HRCoreService - Build & Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'HRCoreService/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'HRCoreService/**'
  workflow_dispatch: {}

jobs:
  ci:
    uses: ./.github/workflows/_reusable-dotnet-build.yml
    with:
      service_name: hrcore-service
      project_path: HRCoreService/HRCoreService/HRCoreService.csproj
      test_project_path: ""
      # Dockerfile viết theo kiểu VS tự sinh: COPY ["HRCoreService/HRCoreService.csproj", "HRCoreService/"]
      # nghĩa là nó cần context ở thư mục CHA (./HRCoreService), không phải thư mục chứa .csproj trực tiếp.
      dockerfile_path: ./HRCoreService/HRCoreService/Dockerfile
      context_path: ./HRCoreService
      dotnet_version: '10.0.x'
      image_name: hrcore-service
      trivy_scan_ref: HRCoreService/HRCoreService
      enable_sonar: ${{ vars.SONAR_ORGANIZATION != '' }}
      enable_slack_notify: true
      fail_on_critical_vuln: false
    secrets: inherit
