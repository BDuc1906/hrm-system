name: Attendance Service - Security & Code Quality Checks

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'attendance-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'attendance-service/**'
  schedule:
    # Chạy hàng ngày lúc 2h sáng UTC
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  security:
    uses: ./.github/workflows/_reusable-dotnet-security.yml
    with:
      service_name: attendance-service
      service_path: attendance-service
      dockerfile_path: attendance-service/API/Dockerfile
      docker_context_path: attendance-service
      dotnet_version: '10.0.x'
      project_path: attendance-service/API/API.csproj
    secrets: inherit
