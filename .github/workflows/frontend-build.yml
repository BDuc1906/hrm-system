name: Frontend - Build & Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Front_end/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'Front_end/**'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x' # khớp với "engines.node" trong package.json (^20.19.0 || >=22.12.0)
          cache: 'npm'
          cache-dependency-path: Front_end/package-lock.json

      - name: Install dependencies
        working-directory: Front_end
        run: npm ci

      - name: Check code format
        working-directory: Front_end
        run: npx prettier --check src/

      - name: Build
        working-directory: Front_end
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Front_end/dist
          if-no-files-found: warn

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io bắt buộc tên repository toàn chữ thường.
      - name: Chuẩn hóa tên image về chữ thường
        run: echo "IMAGE_NAME_LC=$(echo '${{ github.repository_owner }}/hrm-frontend' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Front_end
          file: ./Front_end/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME_LC }}:latest
            ghcr.io/${{ env.IMAGE_NAME_LC }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME_LC }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME_LC }}:buildcache,mode=max
